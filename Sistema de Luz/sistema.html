    <section class="painel" id="painel">
    <div class="painel-cabecalho">
        <h1>Controle de iluminação</h1>
        <p>Escolha um ambiente e controle suas luzes.</p>
    </div>

    <div class="ambientes">

        <div class="ambiente" data-ambiente="sala">
            <div class="ambiente-topo">
                <h2>Sala</h2>
            </div>
            <p>Iluminação da sala</p>

            <div class="controles-luz">

                    ON
                </button>
                <button class="btn-luz btn-off" type="button">
                    OFF
                </button>
            </div>
        </div>
